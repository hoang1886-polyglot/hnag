<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hôm nay ăn gì nhỉ? — Recipe Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>

<style>
  :root {
    --beige: #F6F1E9;
    --beige-deep: #EDE5D2;
    --beige-card: #FDFAF5;
    --warm: #C8845A;
    --warm-light: #E8C5A4;
    --warm-dark: #96563A;
    --warm-pale: #F5E4D6;
    --text: #3A2E28;
    --text-muted: #8C7B6B;
    --text-light: #B8A898;
    --border: #E2D8C8;
    --success: #6B9E78;
    --danger: #C0504D;
    --radius: 14px;
    --radius-sm: 8px;
    --shadow: 0 4px 24px rgba(150,86,58,0.10);
    --shadow-lg: 0 12px 40px rgba(150,86,58,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--beige);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    position: sticky; top: 0; z-index: 200;
    background: rgba(246,241,233,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 28px;
    height: 64px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
  }
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 20px; font-style: italic;
    color: var(--warm-dark);
    white-space: nowrap;
  }
  .header-nav { display: flex; gap: 4px; flex-wrap: wrap; }
  .nav-btn {
    padding: 7px 16px; border-radius: 20px; border: none;
    cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px;
    transition: all .2s; background: transparent; color: var(--text-muted);
  }
  .nav-btn.active { background: var(--warm); color: #fff; font-weight: 600; }
  .nav-btn:hover:not(.active) { background: var(--beige-deep); }

  .lang-switcher { display: flex; gap: 4px; }
  .lang-btn {
    padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border); background: transparent;
    color: var(--text-muted); transition: all .2s;
  }
  .lang-btn.active { background: var(--warm); color: #fff; border-color: var(--warm); }

  /* ── MAIN ── */
  main { max-width: 1200px; margin: 0 auto; padding: 36px 24px; }

  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(30px, 5vw, 52px);
    font-style: italic; color: var(--warm-dark);
    letter-spacing: -1px; margin-bottom: 8px;
    animation: fadeUp .6s ease both;
  }
  .hero-sub {
    color: var(--text-muted); font-size: 15px; margin-bottom: 32px;
    animation: fadeUp .6s .1s ease both;
  }
  @keyframes fadeUp {
    from { opacity:0; transform: translateY(14px); }
    to { opacity:1; transform: translateY(0); }
  }

  /* ── SEARCH ── */
  .search-row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .search-row input { flex: 1; min-width: 180px; }
  .ing-row { display: flex; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; }
  .ing-row input { flex: 1; min-width: 180px; }

  /* ── FILTER PILLS ── */
  .pill-row { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 16px; }
  .pill {
    padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 500;
    cursor: pointer; border: 1px solid var(--border); background: var(--beige-card);
    color: var(--text-muted); transition: all .2s;
  }
  .pill.active { background: var(--warm); color: #fff; border-color: var(--warm); }
  .pill:hover:not(.active) { border-color: var(--warm-light); }
  .pill-dashed { border-style: dashed !important; }

  /* ── RECIPE GRID ── */
  .recipe-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 22px;
  }
  .recipe-card {
    background: var(--beige-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden; cursor: pointer;
    transition: transform .25s, box-shadow .25s;
  }
  .recipe-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); }
  .card-photo {
    height: 165px; background: linear-gradient(135deg, var(--beige-deep), var(--warm-light));
    display: flex; align-items: center; justify-content: center;
    font-size: 42px; background-size: cover; background-position: center;
    position: relative;
  }
  .card-actions {
    position: absolute; top: 8px; right: 8px; display: flex; gap: 5px; opacity: 0;
    transition: opacity .2s;
  }
  .recipe-card:hover .card-actions { opacity: 1; }
  .card-action-btn {
    width: 30px; height: 30px; border-radius: 8px; border: none; cursor: pointer;
    font-size: 13px; display: flex; align-items: center; justify-content: center;
    font-family: inherit; backdrop-filter: blur(4px);
  }
  .card-action-btn.edit { background: rgba(255,255,255,0.9); color: var(--text-muted); }
  .card-action-btn.del { background: rgba(192,80,77,0.15); color: var(--danger); }
  .card-body { padding: 16px 18px 18px; }
  .card-name { font-size: 16px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
  .card-desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; margin-bottom: 12px; }
  .card-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px;
    font-weight: 600; background: var(--warm-pale); color: var(--warm-dark);
  }
  .badge.country { background: #E8F4EE; color: var(--success); }
  .nut-row {
    display: grid; grid-template-columns: repeat(4,1fr);
    gap: 6px; padding-top: 10px; border-top: 1px solid var(--border);
  }
  .nut-cell { text-align: center; }
  .nut-val { font-size: 13px; font-weight: 700; color: var(--warm); }
  .nut-lbl { font-size: 10px; color: var(--text-light); }

  /* ── INPUTS / BUTTONS ── */
  input, select, textarea {
    width: 100%; padding: 10px 14px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: #fff; font-size: 14px;
    font-family: 'DM Sans', sans-serif; color: var(--text);
    outline: none; transition: border .2s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--warm); }
  textarea { resize: vertical; }

  .btn {
    padding: 10px 20px; border-radius: var(--radius-sm); border: none;
    cursor: pointer; font-size: 13px; font-family: 'DM Sans', sans-serif;
    font-weight: 600; transition: all .2s; white-space: nowrap;
  }
  .btn-primary { background: var(--warm); color: #fff; }
  .btn-primary:hover { background: var(--warm-dark); }
  .btn-secondary {
    background: transparent; border: 1px solid var(--border); color: var(--text-muted);
  }
  .btn-secondary:hover { background: var(--beige-deep); }
  .btn-danger { background: #FDEAEA; color: var(--danger); }
  .btn-sm { padding: 5px 12px; font-size: 12px; }
  .btn-icon { padding: 5px 10px; font-size: 13px; }

  label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 5px;
    font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(58,46,40,.52);
    z-index: 500; display: flex; align-items: flex-start;
    justify-content: center; overflow-y: auto; padding: 24px 16px;
    animation: fadeIn .18s ease;
  }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .modal-box {
    background: var(--beige-card); border-radius: 20px;
    width: 100%; max-width: 680px; padding: 32px; margin: auto;
    animation: slideUp .22s ease;
  }
  .modal-box.wide { max-width: 780px; }
  .modal-box.narrow { max-width: 400px; }
  @keyframes slideUp {
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px;
  }
  .modal-title {
    font-family: 'Playfair Display', serif; font-size: 22px; color: var(--warm-dark);
  }

  .section-title {
    font-size: 14px; font-weight: 700; color: var(--text);
    margin-bottom: 14px; padding-bottom: 8px;
    border-bottom: 2px solid var(--border); text-transform: uppercase;
    letter-spacing: .5px;
  }

  /* ── INGREDIENT ROW ── */
  .ing-row-grid {
    display: grid; grid-template-columns: 1fr 80px 64px 34px;
    gap: 8px; margin-bottom: 8px; align-items: center;
  }

  /* ── STEP ROW ── */
  .step-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-start; }
  .step-num {
    width: 28px; height: 28px; border-radius: 50%; background: var(--warm);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; flex-shrink: 0; margin-top: 8px;
  }

  /* ── DETAIL MODAL ── */
  .detail-photo {
    height: 210px; border-radius: var(--radius); margin-bottom: 22px;
    background: linear-gradient(135deg, var(--beige-deep), var(--warm-light));
    display: flex; align-items: flex-end; padding: 16px;
    background-size: cover; background-position: center; position: relative;
  }
  .detail-photo-overlay {
    background: rgba(58,46,40,.65); border-radius: 10px; padding: 10px 14px; flex: 1;
  }
  .detail-photo-title { color: #fff; font-size: 22px; font-family:'Playfair Display',serif; }
  .detail-photo-desc { color: rgba(255,255,255,.8); font-size: 13px; margin-top: 3px; }

  .story-block {
    background: var(--warm-pale); border-left: 4px solid var(--warm);
    border-radius: 10px; padding: 14px 16px; margin-bottom: 20px;
  }
  .story-label { font-size: 10px; font-weight: 700; color: var(--warm); letter-spacing: 1px; margin-bottom: 6px; }
  .story-text { color: var(--text); line-height: 1.65; font-style: italic; font-size: 14px; }

  .scale-box {
    background: var(--beige-deep); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px;
  }
  .scale-label { font-size: 12px; font-weight: 700; color: var(--warm-dark); margin-bottom: 10px; }
  .scale-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .scale-controls input { width: 80px; }

  .ing-detail-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 0; border-bottom: 1px solid var(--border);
  }
  .ing-name { font-size: 14px; color: var(--text); }
  .ing-sub { font-size: 11px; color: var(--text-light); margin-left: 8px; }
  .ing-amount { font-weight: 700; color: var(--warm); font-size: 14px; }
  .ing-orig { font-size: 11px; color: var(--text-light); margin-left: 6px; }

  .nut-summary {
    background: var(--beige-deep); border-radius: 12px; padding: 16px; margin-bottom: 18px;
    display: grid; grid-template-columns: repeat(4,1fr); gap: 12px;
  }
  .nut-big { text-align: center; }
  .nut-big-val { font-size: 24px; font-weight: 700; }
  .nut-big-unit { font-size: 11px; color: var(--text-muted); }
  .nut-big-lbl { font-size: 11px; color: var(--text-light); }

  /* ── MEAL PLAN ── */
  .view-tabs { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; align-items: center; }
  .meal-slot {
    background: var(--beige-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
  }
  .meal-slot-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
  }
  .meal-slot-title { font-size: 15px; font-weight: 700; color: var(--warm-dark); }
  .meal-entry {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-top: 1px solid var(--border);
  }
  .meal-entry-name { font-size: 14px; color: var(--text); }
  .meal-entry-meta { font-size: 11px; color: var(--text-light); margin-left: 8px; }
  .meal-cal { font-size: 12px; font-weight: 700; color: var(--warm); }

  .day-nut-bar {
    background: var(--beige-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin-bottom: 22px;
    display: grid; grid-template-columns: repeat(4,1fr); gap: 12px;
  }
  .day-nut-val { font-size: 22px; font-weight: 700; }
  .day-nut-lbl { font-size: 11px; color: var(--text-light); }

  /* ── ANALYTICS ── */
  .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 16px; margin-bottom: 28px; }
  .stat-card {
    background: var(--beige-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; text-align: center;
  }
  .stat-val { font-size: 28px; font-weight: 700; }
  .stat-lbl { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  .chart-box {
    background: var(--beige-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; margin-bottom: 22px;
  }
  .bar-chart { display: flex; gap: 8px; align-items: flex-end; height: 140px; margin-top: 12px; }
  .bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .bar { width: 100%; background: linear-gradient(180deg, var(--warm), var(--warm-light)); border-radius: 4px 4px 0 0; min-height: 4px; transition: height .5s; }
  .bar-val { font-size: 10px; color: var(--text-muted); }
  .bar-date { font-size: 9px; color: var(--text-light); }

  /* ── PROFILE ── */
  .profile-box {
    background: var(--beige-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 28px; max-width: 480px;
  }
  .avatar {
    width: 70px; height: 70px; border-radius: 50%; background: var(--warm);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; margin-bottom: 22px;
  }

  /* ── EMPTY ── */
  .empty { text-align: center; padding: 60px 0; color: var(--text-muted); }
  .empty-icon { font-size: 52px; margin-bottom: 16px; }

  /* ── FORM GRID HELPERS ── */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }
  .mb8 { margin-bottom: 8px; }
  .mb12 { margin-bottom: 12px; }
  .mb16 { margin-bottom: 16px; }
  .mb20 { margin-bottom: 20px; }
  .mb24 { margin-bottom: 24px; }
  .mb28 { margin-bottom: 28px; }
  .flex-end { display: flex; gap: 10px; justify-content: flex-end; }
  .flex-center { display: flex; align-items: center; gap: 10px; }
  .hidden { display: none !important; }

  /* ── PHOTO UPLOAD ── */
  .photo-label {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 16px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); cursor: pointer; font-size: 13px;
    color: var(--text-muted); background: var(--beige-deep); transition: all .2s;
  }
  .photo-label:hover { border-color: var(--warm); color: var(--warm); }

  /* ── COUNTRY SECTION ── */
  .country-section { margin-bottom: 20px; }
  .country-label { font-size: 12px; color: var(--text-muted); margin-right: 8px; }

  /* ── RESPONSIVE ── */
  @media (max-width: 640px) {
    header { padding: 0 14px; height: auto; flex-wrap: wrap; padding: 10px 14px; gap: 8px; }
    .header-nav { order: 3; width: 100%; }
    main { padding: 20px 14px; }
    .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
    .ing-row-grid { grid-template-columns: 1fr 70px 50px 30px; }
    .nut-summary { grid-template-columns: repeat(2,1fr); }
    .day-nut-bar { grid-template-columns: repeat(2,1fr); }
  }
</style>
</head>
<body>

<!-- ── HEADER ── -->
<header>
  <div class="logo">🍜 Recipe Book</div>
  <nav class="header-nav" id="main-nav">
    <button class="nav-btn active" onclick="showTab('recipes')" data-tab="recipes" id="nav-recipes">Recipes</button>
    <button class="nav-btn" onclick="showTab('mealplan')" data-tab="mealplan" id="nav-mealplan">Meal Plan</button>
    <button class="nav-btn" onclick="showTab('analytics')" data-tab="analytics" id="nav-analytics">Analytics</button>
    <button class="nav-btn" onclick="showTab('profile')" data-tab="profile" id="nav-profile">Profile</button>
  </nav>
  <div class="lang-switcher">
    <button class="lang-btn" onclick="setLang('vi')" id="lang-vi">VI</button>
    <button class="lang-btn active" onclick="setLang('en')" id="lang-en">EN</button>
    <button class="lang-btn" onclick="setLang('ru')" id="lang-ru">RU</button>
  </div>
</header>

<!-- ── MAIN ── -->
<main>

  <!-- RECIPES TAB -->
  <div id="tab-recipes">
    <h1 class="hero-title">Hôm nay ăn gì nhỉ?</h1>
    <p class="hero-sub" id="hero-sub">Your personal recipe manager</p>

    <div class="search-row">
      <input type="text" id="search-input" placeholder="Search recipes..." oninput="renderRecipes()"/>
      <button class="btn btn-primary" onclick="openAddModal()">+ <span data-i="recipe.add">Add Recipe</span></button>
    </div>

    <div class="ing-row">
      <input type="text" id="ing-search" placeholder="Enter ingredients you have at home (comma separated)..."/>
      <button class="btn btn-secondary" onclick="searchByIngredient()">🔍 <span data-i="search.findRecipes">Find</span></button>
      <button class="btn btn-danger btn-sm" id="clear-ing" onclick="clearIngSearch()" style="display:none">✕</button>
    </div>

    <!-- Category pills -->
    <div class="pill-row" id="cat-pills"></div>

    <!-- Country filter -->
    <div class="country-section">
      <span class="country-label">🌍 <span data-i="countries.title">By Country</span>:</span>
      <span class="pill-row" id="country-pills" style="display:inline-flex; flex-wrap:wrap; gap:6px; vertical-align:middle;"></span>
    </div>

    <!-- Grid -->
    <div class="recipe-grid" id="recipe-grid"></div>
    <div class="empty hidden" id="recipe-empty">
      <div class="empty-icon">🍽</div>
      <p id="empty-text">No recipes yet. Add your first one!</p>
    </div>
  </div>

  <!-- MEAL PLAN TAB -->
  <div id="tab-mealplan" class="hidden">
    <div class="view-tabs">
      <button class="btn btn-primary btn-sm" id="mp-day" onclick="setMpView('day')"><span data-i="mealPlan.day">Day</span></button>
      <button class="btn btn-secondary btn-sm" id="mp-week" onclick="setMpView('week')"><span data-i="mealPlan.week">Week</span></button>
      <button class="btn btn-secondary btn-sm" id="mp-month" onclick="setMpView('month')"><span data-i="mealPlan.month">Month</span></button>
      <input type="date" id="mp-date" style="width:160px" onchange="renderMealPlan()"/>
    </div>
    <div class="day-nut-bar" id="mp-nut-bar"></div>
    <div id="meal-slots"></div>
  </div>

  <!-- ANALYTICS TAB -->
  <div id="tab-analytics" class="hidden">
    <div class="stat-cards" id="stat-cards"></div>
    <div class="chart-box">
      <div class="section-title">7-DAY CALORIES</div>
      <div class="bar-chart" id="bar-chart"></div>
    </div>
    <div class="chart-box">
      <div class="section-title" data-i="analytics.topRecipe">Top Recipes</div>
      <div id="top-recipes-list"></div>
    </div>
  </div>

  <!-- PROFILE TAB -->
  <div id="tab-profile" class="hidden">
    <div class="profile-box">
      <div class="avatar">👤</div>
      <div class="mb16">
        <label data-i="profile.name">Name</label>
        <input type="text" id="profile-name"/>
      </div>
      <div class="mb16">
        <label data-i="profile.goal">Calorie goal / day</label>
        <input type="number" id="profile-cal"/>
      </div>
      <div class="mb20">
        <label>Notes</label>
        <textarea id="profile-notes" rows="3"></textarea>
      </div>
      <button class="btn btn-primary" onclick="saveProfile()"><span data-i="profile.save">Save Profile</span></button>
    </div>
  </div>

</main>

<!-- ══ MODALS ══ -->

<!-- ADD/EDIT RECIPE MODAL -->
<div class="modal-overlay hidden" id="recipe-modal" onclick="closeModalOnBg(event,'recipe-modal')">
  <div class="modal-box wide">
    <div class="modal-header">
      <div class="modal-title" id="recipe-modal-title">Add Recipe</div>
      <button class="btn btn-secondary btn-sm" onclick="closeModal('recipe-modal')">✕</button>
    </div>

    <div class="grid-2 mb16">
      <div><label data-i="recipe.name">Dish Name</label><input type="text" id="f-name"/></div>

let lang = 'en';

function load(k, def) { try { return JSON.parse(localStorage.getItem(k)) || def; } catch { return def; } }
let recipes = load('rcp_recipes', SAMPLE);
let mealPlan = load('rcp_mealplan', []);

let countries = load('rcp_countries', ['Vietnam','Japan','Italy','France','Thailand','China','India','Mexico','Russia','Korea']);

function save() {

  localStorage.setItem('rcp_mealplan', JSON.stringify(mealPlan));
  localStorage.setItem('rcp_profile', JSON.stringify(profile));
  localStorage.setItem('rcp_countries', JSON.stringify(countries));

// ─── TRANSLATIONS APPLY ────────────────────────────────────────────────────────
function t(path) {
  return path.split('.').reduce((o,k) => o?.[k], T[lang]) || path;
}

function applyLang() {
  // hero
  document.getElementById('hero-sub').textContent = T[lang].appSub;
  // nav
  ['recipes','mealplan','analytics','profile'].forEach(k => {
    const el = document.getElementById('nav-' + k);
    if (el) el.textContent = T[lang].nav[k];
  });
  // data-i elements
  document.querySelectorAll('[data-i]').forEach(el => {
    const v = el.getAttribute('data-i').split('.').reduce((o,k) => o?.[k], T[lang]);
    if (v) el.textContent = v;
  });
  // search placeholders
  const si = document.getElementById('search-input');
  if (si) si.placeholder = T[lang].search.placeholder;
  const ii = document.getElementById('ing-search');
  if (ii) ii.placeholder = T[lang].search.ingredientPlaceholder;
  // rebuild dynamic areas
  renderCategoryPills();
  renderCountryPills();
  renderRecipes();
  renderCategorySelect();
}

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('lang-' + l).classList.add('active');
  applyLang();
}

// ─── TAB NAVIGATION ───────────────────────────────────────────────────────────
function showTab(tab) {
  currentTab = tab;
  ['recipes','mealplan','analytics','profile'].forEach(k => {
    document.getElementById('tab-'+k).classList.toggle('hidden', k !== tab);
    document.getElementById('nav-'+k).classList.toggle('active', k === tab);
  });
  if (tab === 'mealplan') { initMealPlanDate(); renderMealPlan(); }
  if (tab === 'analytics') renderAnalytics();
  if (tab === 'profile') loadProfileForm();
}

// ─── CATEGORY PILLS ──────────────────────────────────────────────────────────
const CATS = ['all','desserts','asian','european','drinks','hot','cold','party','diet','vegetarian'];

function renderCategoryPills() {
  const c = document.getElementById('cat-pills');
  c.innerHTML = CATS.map(cat =>
    `<span class="pill${selectedCat===cat?' active':''}" onclick="selectCat('${cat}')">${T[lang].categories[cat]}</span>`
  ).join('');
}

function selectCat(cat) {
  selectedCat = cat;
  renderCategoryPills();
  renderRecipes();
}

// ─── COUNTRY PILLS ───────────────────────────────────────────────────────────
function renderCountryPills() {
  const c = document.getElementById('country-pills');
  let html = `<span class="pill${countryFilter===''?' active':''}" onclick="filterCountry('')">${T[lang].categories.all}</span>`;
  countries.forEach(co => {
    html += `<span class="pill${countryFilter===co?' active':''}" onclick="filterCountry('${co}')">${co}</span>`;
  });
  html += `<span class="pill pill-dashed" onclick="openModal('country-modal')">+ ${T[lang].countries.add}</span>`;
  c.innerHTML = html;
  // refresh datalist
  const dl = document.getElementById('country-datalist');
  if (dl) dl.innerHTML = countries.map(c => `<option value="${c}"/>`).join('');
}

function filterCountry(c) {
  countryFilter = c;
  renderCountryPills();
  renderRecipes();
}

// ─── RECIPE GRID ─────────────────────────────────────────────────────────────
function renderRecipes() {
  const search = document.getElementById('search-input')?.value.toLowerCase() || '';
  let list = recipes;
  if (selectedCat !== 'all') list = list.filter(r => r.category === selectedCat);
  if (countryFilter) list = list.filter(r => r.country === countryFilter);
  if (search) list = list.filter(r =>
    r.name.toLowerCase().includes(search) || r.description.toLowerCase().includes(search)
  );
  if (ingQuery) {
    const terms = ingQuery.toLowerCase().split(',').map(s => s.trim()).filter(Boolean);
    list = list.filter(r => terms.some(term => r.ingredients.some(i => i.name.toLowerCase().includes(term))));
  }

  const grid = document.getElementById('recipe-grid');
  const empty = document.getElementById('recipe-empty');

  if (list.length === 0) {
    grid.innerHTML = '';
    empty.classList.remove('hidden');
    document.getElementById('empty-text').textContent = (search || ingQuery) ? T[lang].noResults : T[lang].empty;
    return;
  }
  empty.classList.add('hidden');

  grid.innerHTML = list.map(r => {
    const bg = r.photo ? `background-image:url(${r.photo})` : '';
    const emoji = !r.photo ? '🍽' : '';
    return `<div class="recipe-card" onclick="openDetail('${r.id}')">
      <div class="card-photo" style="${bg}">
        ${emoji ? `<span style="font-size:42px">${emoji}</span>` : ''}
        <div class="card-actions">
          <button class="card-action-btn edit" onclick="event.stopPropagation();openEditModal('${r.id}')">✏</button>
          <button class="card-action-btn del" onclick="event.stopPropagation();deleteRecipe('${r.id}')">✕</button>
        </div>
      </div>
      <div class="card-body">
        <div class="card-name">${r.name}</div>
        <div class="card-desc">${r.description}</div>
        <div class="card-badges">
          <span class="badge">${T[lang].categories[r.category]||r.category}</span>
          ${r.country ? `<span class="badge country">🌍 ${r.country}</span>` : ''}
          ${r.time ? `<span class="badge" style="background:#EAF3F0;color:#3A8A72">⏱ ${r.time}m</span>` : ''}
        </div>
        <div class="nut-row">
          <div class="nut-cell"><div class="nut-val">${r.nutrition.calories}</div><div class="nut-lbl">kcal</div></div>
          <div class="nut-cell"><div class="nut-val">${r.nutrition.protein}g</div><div class="nut-lbl">P</div></div>
          <div class="nut-cell"><div class="nut-val">${r.nutrition.fat}g</div><div class="nut-lbl">F</div></div>
          <div class="nut-cell"><div class="nut-val">${r.nutrition.carbs}g</div><div class="nut-lbl">C</div></div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function searchByIngredient() {
  ingQuery = document.getElementById('ing-search').value;
  document.getElementById('clear-ing').style.display = ingQuery ? '' : 'none';
  renderRecipes();
}
function clearIngSearch() {
  ingQuery = '';
  document.getElementById('ing-search').value = '';
  document.getElementById('clear-ing').style.display = 'none';
  renderRecipes();
}

// ─── RECIPE DETAIL MODAL ──────────────────────────────────────────────────────
function openDetail(id) {
  const r = recipes.find(x => x.id === id);
  if (!r) return;
  // track view
  r.viewedAt = [...(r.viewedAt||[]), new Date().toISOString()];
  save();

  const el = document.getElementById('detail-content');
  el.innerHTML = buildDetailHTML(r, r.servings);
  openModal('detail-modal');
}

function buildDetailHTML(r, scaledServings) {
  const ratio = scaledServings / (r.servings || 1);
  const sn = {
    calories: Math.round(r.nutrition.calories * ratio),
    protein: Math.round(r.nutrition.protein * ratio),
    fat: Math.round(r.nutrition.fat * ratio),
    carbs: Math.round(r.nutrition.carbs * ratio),
  };
  const bg = r.photo ? `background-image:url(${r.photo})` : '';

  const ings = r.ingredients.map(ing => {
    const sc = Math.round(ing.amount * ratio * 10) / 10;
    const sub = r.substitutes?.[ing.id];
    const orig = ratio !== 1 ? `<span class="ing-orig">(orig: ${ing.amount})</span>` : '';
    return `<div class="ing-detail-row">
      <div><span class="ing-name">${ing.name}</span>${sub ? `<span class="ing-sub">→ ${sub}</span>` : ''}</div>
      <div><span class="ing-amount">${sc} ${ing.unit}</span>${orig}</div>
    </div>`;
  }).join('');

  const steps = (r.steps||[]).map((s,i) => `
    <div class="step-row">
      <div class="step-num">${i+1}</div>
      <p style="margin-top:4px;line-height:1.6;font-size:14px">${s}</p>
    </div>`).join('');

  return `
    <div class="modal-header">
      <div></div>
      <button class="btn btn-secondary btn-sm" onclick="closeModal('detail-modal')">✕</button>
    </div>
    <div class="detail-photo" style="${bg}">
      ${!r.photo ? '<span style="font-size:52px;margin:auto">🍽</span>' : ''}
      <div class="detail-photo-overlay">
        <div class="detail-photo-title">${r.name}</div>
        <div class="detail-photo-desc">${r.description}</div>
      </div>
    </div>
    ${r.story ? `<div class="story-block"><div class="story-label">STORY / CÂU CHUYỆN / ИСТОРИЯ</div><div class="story-text">${r.story}</div></div>` : ''}

    <div class="scale-box mb20">
      <div class="scale-label">⚖ ${T[lang].scale.title}</div>
      <div class="scale-controls">
        <span style="font-size:13px;color:var(--text-muted)">${T[lang].recipe.servings}:</span>
        <input type="number" min="0.5" step="0.5" value="${scaledServings}" style="width:80px"
          onchange="updateDetailScale('${r.id}', this.value)"/>
        <span style="font-size:12px;color:var(--text-muted)">orig: ${r.servings} → ×${ratio.toFixed(2)}</span>
      </div>
    </div>

    <div class="mb20">
      <div class="section-title">${T[lang].recipe.ingredients}</div>
      ${ings}
    </div>

    <div class="mb20">
      <div class="section-title">${T[lang].recipe.steps}</div>
      ${steps}
    </div>

    <div class="nut-summary mb16">
      <div class="nut-big"><div class="nut-big-val" style="color:#E08050">${sn.calories}</div><div class="nut-big-unit">kcal</div><div class="nut-big-lbl">Calories</div></div>
      <div class="nut-big"><div class="nut-big-val" style="color:#5A9E6B">${sn.protein}</div><div class="nut-big-unit">g</div><div class="nut-big-lbl">Protein</div></div>
      <div class="nut-big"><div class="nut-big-val" style="color:#D4875A">${sn.fat}</div><div class="nut-big-unit">g</div><div class="nut-big-lbl">Fat</div></div>
      <div class="nut-big"><div class="nut-big-val" style="color:#7B9ECC">${sn.carbs}</div><div class="nut-big-unit">g</div><div class="nut-big-lbl">Carbs</div></div>
    </div>
    ${r.notes ? `<p style="font-size:13px;color:var(--text-muted);font-style:italic;margin-bottom:16px">📝 ${r.notes}</p>` : ''}
    <div class="flex-end">
      <button class="btn btn-secondary" onclick="closeModal('detail-modal')">${T[lang].recipe.cancel}</button>
      <button class="btn btn-primary" onclick="closeModal('detail-modal');openEditModal('${r.id}')">✏ ${T[lang].recipe.edit}</button>
    </div>`;
}

function updateDetailScale(id, newServings) {
  const r = recipes.find(x => x.id === id);
  if (!r) return;
  const el = document.getElementById('detail-content');
  el.innerHTML = buildDetailHTML(r, parseFloat(newServings) || r.servings);
}

// ─── ADD / EDIT MODAL ─────────────────────────────────────────────────────────
function renderCategorySelect() {
  const sel = document.getElementById('f-category');
  if (!sel) return;
  const cats = ['desserts','asian','european','drinks','hot','cold','party','diet','vegetarian'];
  sel.innerHTML = cats.map(c => `<option value="${c}">${T[lang].categories[c]}</option>`).join('');
}

function openAddModal() {
  editingId = null;
  document.getElementById('recipe-modal-title').textContent = T[lang].recipe.add;
  clearForm();
  renderCategorySelect();
  openModal('recipe-modal');
}

function openEditModal(id) {
  const r = recipes.find(x => x.id === id);
  if (!r) return;
  editingId = id;
  document.getElementById('recipe-modal-title').textContent = T[lang].recipe.edit;
  renderCategorySelect();
  fillForm(r);
  openModal('recipe-modal');
}

function clearForm() {
  ['f-name','f-description','f-story','f-country','f-notes'].forEach(id => { const el=document.getElementById(id); if(el) el.value=''; });
  document.getElementById('f-servings').value = 2;
  document.getElementById('f-time').value = 30;
  document.getElementById('f-cal').value = 0;
  document.getElementById('f-protein').value = 0;
  document.getElementById('f-fat').value = 0;
  document.getElementById('f-carbs').value = 0;
  document.getElementById('f-id').value = '';
  document.getElementById('f-photo-data').value = '';
  document.getElementById('f-photo-preview').style.display = 'none';
  document.getElementById('f-ingredients').innerHTML = '';
  document.getElementById('f-steps').innerHTML = '';
  addIngredientRow();
  addStepRow();
}

function fillForm(r) {
  document.getElementById('f-id').value = r.id;
  document.getElementById('f-name').value = r.name;
  document.getElementById('f-description').value = r.description;
  document.getElementById('f-story').value = r.story || '';
  document.getElementById('f-servings').value = r.servings;
  document.getElementById('f-time').value = r.time;
  document.getElementById('f-country').value = r.country || '';
  document.getElementById('f-notes').value = r.notes || '';
  document.getElementById('f-cal').value = r.nutrition.calories;
  document.getElementById('f-protein').value = r.nutrition.protein;
  document.getElementById('f-fat').value = r.nutrition.fat;
  document.getElementById('f-carbs').value = r.nutrition.carbs;
  document.getElementById('f-category').value = r.category;
  document.getElementById('f-photo-data').value = r.photo || '';
  if (r.photo) {
    const prev = document.getElementById('f-photo-preview');
    prev.src = r.photo; prev.style.display = '';
  }
  // Ingredients
  document.getElementById('f-ingredients').innerHTML = '';
  (r.ingredients||[]).forEach(ing => addIngredientRow(ing));
  // Steps
  document.getElementById('f-steps').innerHTML = '';
  (r.steps||[]).forEach(s => addStepRow(s));
}

let ingCount = 0;
function addIngredientRow(ing = null) {
  ingCount++;
  const id = 'ing-' + ingCount;
  const row = document.createElement('div');
  row.className = 'ing-row-grid';
  row.id = id;
  row.innerHTML = `
    <input type="text" placeholder="${T[lang].recipe.ingredientName||'Ingredient'}" value="${ing?.name||''}" class="ing-name-input"/>
    <input type="number" placeholder="g" value="${ing?.amount||''}" class="ing-amount-input" min="0"/>
    <input type="text" placeholder="g/ml" value="${ing?.unit||'g'}" class="ing-unit-input"/>
    <button class="btn btn-danger btn-icon" onclick="document.getElementById('${id}').remove()">✕</button>`;
  document.getElementById('f-ingredients').appendChild(row);
}

let stepCount = 0;
function addStepRow(text = '') {
  stepCount++;
  const idx = document.getElementById('f-steps').children.length + 1;
  const row = document.createElement('div');
  row.className = 'step-row';
  row.innerHTML = `
    <div class="step-num">${idx}</div>
    <input type="text" value="${text}" placeholder="Step ${idx}" style="flex:1"/>
    <button class="btn btn-danger btn-icon" onclick="this.parentElement.remove();renumberSteps()">✕</button>`;
  document.getElementById('f-steps').appendChild(row);
}

function renumberSteps() {
  document.querySelectorAll('#f-steps .step-num').forEach((el, i) => el.textContent = i + 1);
}

function handlePhotoUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('f-photo-data').value = ev.target.result;
    const prev = document.getElementById('f-photo-preview');
    prev.src = ev.target.result; prev.style.display = '';
  };
  reader.readAsDataURL(file);
}

function saveRecipeForm() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { alert('Please enter a recipe name'); return; }

  // Collect ingredients
  const ingRows = document.querySelectorAll('#f-ingredients .ing-row-grid');
  const ingredients = Array.from(ingRows).map((row, i) => ({
    id: 'i' + (i+1),
    name: row.querySelector('.ing-name-input').value,
    amount: parseFloat(row.querySelector('.ing-amount-input').value) || 0,
    unit: row.querySelector('.ing-unit-input').value || 'g',
  })).filter(i => i.name);

  // Collect steps
  const steps = Array.from(document.querySelectorAll('#f-steps input[type=text]'))
    .map(i => i.value.trim()).filter(Boolean);

  const id = document.getElementById('f-id').value || ('r' + Date.now());
  const existing = recipes.find(r => r.id === id);

  const recipe = {
    id,
    name,
    description: document.getElementById('f-description').value,
    story: document.getElementById('f-story').value,
    category: document.getElementById('f-category').value,
    country: document.getElementById('f-country').value,
    servings: parseInt(document.getElementById('f-servings').value) || 2,
    time: parseInt(document.getElementById('f-time').value) || 0,
    photo: document.getElementById('f-photo-data').value,
    nutrition: {
      calories: parseInt(document.getElementById('f-cal').value) || 0,
      protein: parseInt(document.getElementById('f-protein').value) || 0,
      fat: parseInt(document.getElementById('f-fat').value) || 0,
      carbs: parseInt(document.getElementById('f-carbs').value) || 0,
    },
    ingredients,
    steps,
    substitutes: existing?.substitutes || {},
    notes: document.getElementById('f-notes').value,
    viewedAt: existing?.viewedAt || [],
    createdAt: existing?.createdAt || new Date().toISOString(),
  };

  if (existing) {
    recipes = recipes.map(r => r.id === id ? recipe : r);
  } else {
    recipes.push(recipe);
  }
  save();
  closeModal('recipe-modal');
  renderRecipes();
  // add country if new
  if (recipe.country && !countries.includes(recipe.country)) {
    countries.push(recipe.country);
    save();
    renderCountryPills();
  }
}

function deleteRecipe(id) {
  if (!confirm('Delete this recipe?')) return;
  recipes = recipes.filter(r => r.id !== id);
  save();
  renderRecipes();
}

// ─── MEAL PLAN ───────────────────────────────────────────────────────────────
function initMealPlanDate() {
  const el = document.getElementById('mp-date');
  if (!el.value) el.value = new Date().toISOString().slice(0,10);
}

function setMpView(v) {
  mealPlanView = v;
  ['day','week','month'].forEach(k => {
    document.getElementById('mp-'+k).className = 'btn btn-sm ' + (k===v ? 'btn-primary' : 'btn-secondary');
  });
  renderMealPlan();
}

function calcDayNutrition(dateStr) {
  const meals = mealPlan.filter(m => m.date === dateStr);
  return meals.reduce((acc, m) => {
    const r = recipes.find(x => x.id === m.recipeId);
    if (!r) return acc;
    const f = m.servings || 1;
    return { calories: acc.calories + r.nutrition.calories * f, protein: acc.protein + r.nutrition.protein * f, fat: acc.fat + r.nutrition.fat * f, carbs: acc.carbs + r.nutrition.carbs * f };
  }, {calories:0,protein:0,fat:0,carbs:0});
}

function renderMealPlan() {
  const dateEl = document.getElementById('mp-date');
  const dateStr = dateEl?.value || new Date().toISOString().slice(0,10);

  const nut = calcDayNutrition(dateStr);
  document.getElementById('mp-nut-bar').innerHTML = [
    {label:'Calories',val:Math.round(nut.calories),color:'#E08050'},
    {label:'Protein',val:Math.round(nut.protein)+'g',color:'#5A9E6B'},
    {label:'Fat',val:Math.round(nut.fat)+'g',color:'#D4875A'},
    {label:'Carbs',val:Math.round(nut.carbs)+'g',color:'#7B9ECC'},
  ].map(({label,val,color}) =>
    `<div class="nut-big"><div class="nut-big-val" style="color:${color}">${val}</div><div class="nut-big-lbl">${label}</div></div>`
  ).join('');

  const mealTypes = ['breakfast','lunch','dinner','snack'];
  const icons = {breakfast:'🌅',lunch:'☀️',dinner:'🌙',snack:'🍎'};
  const slots = document.getElementById('meal-slots');
  slots.innerHTML = mealTypes.map(type => {
    const typeMeals = mealPlan.filter(m => m.date === dateStr && m.mealType === type);
    const entriesHTML = typeMeals.length === 0
      ? `<p style="margin:0;font-size:13px;color:var(--text-light);font-style:italic">—</p>`
      : typeMeals.map(m => {
          const r = recipes.find(x => x.id === m.recipeId);
          if (!r) return '';
          return `<div class="meal-entry">
            <div>
              <span class="meal-entry-name">${r.name}</span>
              <span class="meal-entry-meta">×${m.servings} | ${m.mealTime}</span>
            </div>
            <div style="display:flex;gap:10px;align-items:center">
              <span class="meal-cal">${Math.round(r.nutrition.calories * m.servings)} kcal</span>
              <button class="btn btn-danger btn-icon" onclick="deleteMealEntry('${m.id}')">✕</button>
            </div>
          </div>`;
        }).join('');
    return `<div class="meal-slot">
      <div class="meal-slot-header">
        <div class="meal-slot-title">${icons[type]} ${T[lang].mealPlan[type]}</div>
        <button class="btn btn-primary btn-sm" onclick="openMealModal('${type}','${dateStr}')">+</button>
      </div>
      ${entriesHTML}
    </div>`;
  }).join('');
}

function openMealModal(type, date) {
  document.getElementById('mp-meal-type').value = type;
  // populate recipe select
  const sel = document.getElementById('mp-recipe-sel');
  sel.innerHTML = `<option value="">—</option>` + recipes.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
  openModal('meal-modal');
  // store date in hidden field
  document.getElementById('mp-meal-type').dataset.date = date;
}

function saveMealEntry() {
  const recipeId = document.getElementById('mp-recipe-sel').value;
  if (!recipeId) return;
  const typeEl = document.getElementById('mp-meal-type');
  mealPlan.push({
    id: 'm' + Date.now(),
    date: typeEl.dataset.date,
    mealType: typeEl.value,
    recipeId,
    mealTime: document.getElementById('mp-time').value,
    servings: parseFloat(document.getElementById('mp-servings').value) || 1,
  });
  save();
  closeModal('meal-modal');
  renderMealPlan();
}

function deleteMealEntry(id) {
  mealPlan = mealPlan.filter(m => m.id !== id);
  save();
  renderMealPlan();
}

// ─── ANALYTICS ───────────────────────────────────────────────────────────────
function renderAnalytics() {
  const today = new Date().toISOString().slice(0,10);
  const todayNut = calcDayNutrition(today);
  const last7 = Array.from({length:7}, (_,i) => {
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = d.toISOString().slice(0,10);
    return {date: ds.slice(5), cal: Math.round(calcDayNutrition(ds).calories)};
  }).reverse();
  const avg = Math.round(last7.reduce((a,d) => a+d.cal, 0) / 7);
  const maxCal = Math.max(...last7.map(d => d.cal), 1);

  document.getElementById('stat-cards').innerHTML = [
    {label: T[lang].analytics.totalCalories, val: Math.round(todayNut.calories)+' kcal', color:'#E08050'},
    {label: T[lang].analytics.avgPerDay, val: avg+' kcal', color:'#5A9E6B'},
    {label: T[lang].analytics.totalRecipes, val: recipes.length, color:'#D4875A'},
  ].map(({label,val,color}) =>
    `<div class="stat-card"><div class="stat-val" style="color:${color}">${val}</div><div class="stat-lbl">${label}</div></div>`
  ).join('');

  document.getElementById('bar-chart').innerHTML = last7.map(({date,cal}) =>
    `<div class="bar-wrap">
      <div class="bar-val">${cal||''}</div>
      <div class="bar" style="height:${Math.max(cal/maxCal*120,4)}px"></div>
      <div class="bar-date">${date}</div>
    </div>`
  ).join('');

  const views = recipes.map(r => ({name:r.name, views:(r.viewedAt||[]).length})).sort((a,b)=>b.views-a.views);
  document.getElementById('top-recipes-list').innerHTML = views.slice(0,5).map((r,i) =>
    `<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)">
      <span style="font-size:14px">#${i+1} ${r.name}</span>
      <span style="font-size:13px;font-weight:700;color:var(--warm)">${r.views} views</span>
    </div>`
  ).join('') || '<p style="color:var(--text-muted);font-size:13px">No views yet</p>';
}

// ─── PROFILE ─────────────────────────────────────────────────────────────────
function loadProfileForm() {
  document.getElementById('profile-name').value = profile.name;
  document.getElementById('profile-cal').value = profile.calorieGoal;
  document.getElementById('profile-notes').value = profile.notes || '';
}
function saveProfile() {
  profile.name = document.getElementById('profile-name').value;
  profile.calorieGoal = parseInt(document.getElementById('profile-cal').value) || 2000;
  profile.notes = document.getElementById('profile-notes').value;
  save();
  alert('Profile saved!');
}

// ─── COUNTRIES ───────────────────────────────────────────────────────────────
function saveCountry() {
  const val = document.getElementById('new-country-input').value.trim();
  if (val && !countries.includes(val)) { countries.push(val); save(); }
  document.getElementById('new-country-input').value = '';
  closeModal('country-modal');
  renderCountryPills();
}

// ─── MODAL HELPERS ───────────────────────────────────────────────────────────
function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
function closeModalOnBg(e, id) { if (e.target === e.currentTarget) closeModal(id); }

// ─── INIT ─────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  renderCategoryPills();
  renderCountryPills();
  renderRecipes();
  initMealPlanDate();
  // set today as default date
  document.getElementById('mp-date').value = new Date().toISOString().slice(0,10);
});
</script>
